[package]
name = "app"
version = "0.1.0"
description = "Betwise Betting Kiosk (Tauri)"
authors = ["Betwise"]
license = "UNLICENSED"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# Avoid libudev system dep — open /dev/ttyUSB* by path (same as Electron serialport usage)
serialport = { version = "4", default-features = false }

[target.'cfg(not(target_os = "android"))'.dependencies]
machine-uid = "0.5"
